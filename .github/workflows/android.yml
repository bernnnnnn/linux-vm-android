name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch the proot runtime
        run: ./tools/fetch-prebuilts.sh

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: berns-linux-ports-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
